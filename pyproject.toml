[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-eval"
version = "0.1.0"
description = "A lightweight framework for evaluating conversation/dialogue AI agents (Demystifying evals for AI agents)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["agent", "evaluation", "conversation", "dialogue", "evals", "llm", "context", "memory", "rag", "benchmark"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = []

[project.scripts]
agent-eval = "agent_eval.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]
retrieval = ["beir>=2.0", "sentence-transformers>=2.0"]
datasets = ["datasets>=2.0", "huggingface_hub>=0.20"]
all = ["beir>=2.0", "sentence-transformers>=2.0", "datasets>=2.0", "huggingface_hub>=0.20"]

[project.entry-points."openclaw.plugins"]
context_memory_eval = "agent_eval.plugins.openclaw:ContextMemoryEvalPlugin"

[tool.pytest.ini_options]
testpaths = ["tests"]
